
name: Unpack Yusee Plugs

on:
  push:
    paths:
      - 'Yusee-Plugs-Admin-Update.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Yusee Plugs files
        run: |
          mkdir -p /tmp/yusee
          unzip -o Yusee-Plugs-Admin-Update.zip -d /tmp/yusee
          cp -R /tmp/yusee/. .
          rm -rf /tmp/yusee
          rm -f Yusee-Plugs-Admin-Update.zip

      - name: Save files to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install Yusee Plugs admin update" || exit 0
          git push
