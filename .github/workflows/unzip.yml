
name: Unpack Yusee Plugs

on:
  push:
    paths:
      - 'Yusee-Plugs-Storefront.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project files
        run: |
          unzip -o Yusee-Plugs-Storefront.zip -d /tmp/project
          cp -R /tmp/project/. .
          rm -rf /tmp/project
          rm -f Yusee-Plugs-Storefront.zip

      - name: Save files to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upload Yusee Plugs project" || exit 0
          git push
